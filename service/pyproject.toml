[project]
name = "climate-loan-monitor-service"
version = "0.1.0"
description = "Climate Loan Monitor v1 data service (FastAPI + DuckDB). Contract: contracts/v1/CONTRACT.md"
requires-python = ">=3.12,<3.13"
# Exact versions installed in .venv on 2026-11-07 (uv, CPython 3.12.14, macOS arm64).
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "duckdb==2.0.0",
    "httpx==0.28.1",
    "requests==2.34.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "xarray==2026.9.0",
    "netCDF4==1.7.5.1.post1",
    "h5netcdf==1.8.2",
    "rasterio==1.5.2",
    "pystac-client==0.9.1",
    "planetary-computer==1.0.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pillow==13.0.0",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "pdfplumber==0.11.10",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "anthropic==2.6.0",
    "python-dotenv==1.2.4",
    "torch==2.15.0",
    "torchvision==0.29.2",
    # AI super-resolution for display (app.superres, SEN2SRLite, CC0; weights vendored in the package)
    "sen2sr==0.8.5",
    "mlstac==0.4.9",
    "timm==1.0.31",
    "einops==0.8.2",
    "huggingface-hub==2.4.0",
    "hf-xet==1.8.0",
    "safetensors==0.8.0",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
